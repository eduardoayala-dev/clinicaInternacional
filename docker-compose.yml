# Entorno local. ProducciÃ³n requiere VERIFY_IDENTITY y la CA del servidor MySQL.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: development
      ADMISION_TOLERANCIA_MINUTOS: ${ADMISION_TOLERANCIA_MINUTOS:-10}
      DB_MODE: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: clinica_db
      DB_USER: clinica_app
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      DB_SSL_MODE: REQUIRED
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--require-secure-transport=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: clinica_db
      MYSQL_USER: clinica_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./sql/init/20-app-permissions.sql:/docker-entrypoint-initdb.d/20-app-permissions.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
