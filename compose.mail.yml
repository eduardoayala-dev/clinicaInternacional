services:
  app:
    environment:
      MAIL_MODE: ${MAIL_MODE:-disabled}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RECOVERY_ENABLED: ${RECOVERY_ENABLED:-false}
      ACCOUNT_VERIFICATION_KEY: ${ACCOUNT_VERIFICATION_KEY:-}
      APPOINTMENT_EMAIL_ENABLED: ${APPOINTMENT_EMAIL_ENABLED:-false}
      RECORDATORIOS_EMAIL_ENABLED: ${RECORDATORIOS_EMAIL_ENABLED:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
